<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo 3D Territorial — Puracé, Sotará & Samanga Baja | Geodesia InSAR & Sismología</title>
    <!-- Three.js + OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #080b11;
            --panel-bg: rgba(15, 23, 42, 0.88);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-cyan: #38bdf8;
            --accent-purple: #c084fc;
            --accent-red: #ef4444;
            --accent-green: #4ade80;
            --accent-gold: #facc15;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Top Header Overlay */
        .header-bar {
            position: absolute;
            top: 16px;
            left: 20px;
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            max-width: 520px;
        }

        .header-bar h1 {
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }

        .header-bar p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
            line-height: 1.4;
        }

        /* Territory Switcher Bar */
        .territory-selector {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .terr-tab {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            color: #cbd5e1;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.76rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .terr-tab:hover {
            background: rgba(56, 189, 248, 0.2);
            color: #fff;
            border-color: var(--accent-cyan);
        }

        .terr-tab.active {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #fff;
            border-color: #38bdf8;
            box-shadow: 0 2px 10px rgba(2, 132, 199, 0.4);
        }

        /* Right Control Panel */
        .controls-panel {
            position: absolute;
            top: 16px;
            right: 20px;
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .panel-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-size: 0.78rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: #cbd5e1;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .control-btn:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent-cyan);
            color: #fff;
        }

        .control-btn.active {
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.8), rgba(14, 165, 233, 0.8));
            border-color: #38bdf8;
            color: #fff;
            font-weight: 600;
        }

        input[type="range"] {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        /* Floating Info Box */
        .info-card {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            font-size: 0.78rem;
            line-height: 1.5;
            max-width: 460px;
        }

        .nav-back-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.9);
            color: #fff;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 0.82rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .nav-back-btn:hover {
            background: #0284c7;
            border-color: #38bdf8;
        }

        #tooltip {
            position: absolute;
            display: none;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--accent-cyan);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.76rem;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>
    <div id="tooltip"></div>

    <!-- Header Overlay with Territory Tabs -->
    <div class="header-bar">
        <h1 id="terr-title"><i class="fa-solid fa-volcano" style="color: #ef4444;"></i> Volcán Puracé</h1>
        <p id="terr-subtitle">Topografía Digital SRTM (30 m), Deformación InSAR Sentinel-1 (2026), Cámara Magmática e Hipocentros SGC.</p>
        
        <div class="territory-selector">
            <button class="terr-tab active" onclick="loadTerritory('purace', this)">
                <i class="fa-solid fa-volcano"></i> Puracé
            </button>
            <button class="terr-tab" onclick="loadTerritory('sotara', this)">
                <i class="fa-solid fa-mountain"></i> Sotará
            </button>
            <button class="terr-tab" onclick="loadTerritory('samanga', this)">
                <i class="fa-solid fa-seedling"></i> Samanga Baja
            </button>
        </div>
    </div>

    <!-- Controls Panel -->
    <div class="controls-panel">
        <div class="panel-title"><i class="fa-solid fa-layer-group"></i> Capas de Superficie</div>
        <div class="btn-grid" id="texture-btn-grid">
            <!-- Dynamically populated per territory -->
        </div>

        <div class="panel-title" style="margin-top: 6px;"><i class="fa-solid fa-sliders"></i> Visualización Geológica</div>
        
        <div class="control-group">
            <label><span>Opacidad Corteza (Rayos X):</span> <span id="opacity-val">100%</span></label>
            <input type="range" id="opacity-slider" min="0.15" max="1.0" step="0.05" value="1.0" oninput="setMeshOpacity(this.value)">
        </div>

        <div class="control-group">
            <label><span>Exageración Vertical:</span> <span id="exag-val">1.6×</span></label>
            <input type="range" id="exag-slider" min="0.8" max="2.8" step="0.1" value="1.6" oninput="setExaggeration(this.value)">
        </div>

        <div class="btn-grid" id="subsurface-btn-grid" style="margin-top: 4px;">
            <!-- Dynamically populated per territory -->
        </div>

        <div class="btn-grid">
            <button class="control-btn" onclick="resetCamera()">🎯 Reset Vista</button>
            <button class="control-btn" id="btn-rotate" onclick="toggleRotation(this)">🔄 Auto-Rotar</button>
        </div>
    </div>

    <!-- Floating Info Box -->
    <div class="info-card" id="info-card-content">
        <!-- Dynamically populated per territory -->
    </div>

    <a href="index.html" class="nav-back-btn">
        <i class="fa-solid fa-arrow-left"></i> Volver al Dashboard SIG
    </a>

    <!-- Canvas Container -->
    <div id="webgl-canvas"></div>

    <script src="territories_3d_data.js"></script>
    <script>
        let scene, camera, renderer, controls;
        let terrainMesh = null;
        let magmaSphere = null;
        let conduitLine = null;
        let seismicGroup = new THREE.Group();
        let scatterersGroup = new THREE.Group();
        let markersGroup = new THREE.Group();
        
        let loadedTextures = {};
        let currentTerritoryId = 'purace';
        let currentTextureId = 'optical';
        let isRotating = false;
        let currentExaggeration = 1.6;

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const tooltip = document.getElementById('tooltip');
        const texLoader = new THREE.TextureLoader();

        function init() {
            const container = document.getElementById('webgl-canvas');
            
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x080b11);
            scene.fog = new THREE.FogExp2(0x080b11, 0.0018);

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.set(0, 140, 210);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // OrbitControls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.15;
            controls.target.set(0, 20, 0);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.70);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 1.25);
            sunLight.position.set(120, 200, 100);
            sunLight.castShadow = true;
            scene.add(sunLight);

            const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.35);
            fillLight.position.set(-150, 50, -100);
            scene.add(fillLight);

            scene.add(seismicGroup);
            scene.add(scatterersGroup);
            scene.add(markersGroup);

            // Load initial territory
            loadTerritory('purace');

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);

            animate();
        }

        function getTexture(filename) {
            if (!loadedTextures[filename]) {
                loadedTextures[filename] = texLoader.load(filename);
            }
            return loadedTextures[filename];
        }

        function loadTerritory(terrId, tabBtn) {
            if (typeof territories3DData === 'undefined' || !territories3DData[terrId]) return;
            currentTerritoryId = terrId;
            const data = territories3DData[terrId];

            if (tabBtn) {
                document.querySelectorAll('.terr-tab').forEach(b => b.classList.remove('active'));
                tabBtn.classList.add('active');
            }

            // Update Header
            const iconMap = { purace: 'fa-volcano', sotara: 'fa-mountain', samanga: 'fa-seedling' };
            const colorMap = { purace: '#ef4444', sotara: '#a855f7', samanga: '#00ff88' };
            document.getElementById('terr-title').innerHTML = `<i class="fa-solid ${iconMap[terrId]}" style="color: ${colorMap[terrId]};"></i> ${data.name}`;
            document.getElementById('terr-subtitle').textContent = data.subtitle;

            // Update Texture Buttons
            const texGrid = document.getElementById('texture-btn-grid');
            texGrid.innerHTML = '';
            data.textures.forEach((t, idx) => {
                const btn = document.createElement('button');
                btn.className = `control-btn ${idx === 0 ? 'active' : ''}`;
                btn.textContent = t.name;
                btn.onclick = () => switchTexture(t.file, btn);
                texGrid.appendChild(btn);
            });
            currentTextureId = data.textures[0].file;

            // Update Subsurface Buttons
            const subGrid = document.getElementById('subsurface-btn-grid');
            subGrid.innerHTML = '';
            if (data.magma_chamber) {
                const bMagma = document.createElement('button');
                bMagma.className = 'control-btn';
                bMagma.id = 'btn-magma';
                bMagma.textContent = '🌋 Ocultar Magma';
                bMagma.onclick = () => toggleSubsurface('magma', bMagma);
                subGrid.appendChild(bMagma);
            }
            if (data.seismic_events && data.seismic_events.length > 0) {
                const bSeismic = document.createElement('button');
                bSeismic.className = 'control-btn';
                bSeismic.id = 'btn-seismic';
                bSeismic.textContent = '⚡ Ocultar Sismos';
                bSeismic.onclick = () => toggleSubsurface('seismic', bSeismic);
                subGrid.appendChild(bSeismic);
            }
            if (data.scatterers && data.scatterers.length > 0) {
                const bScatt = document.createElement('button');
                bScatt.className = 'control-btn';
                bScatt.id = 'btn-scatterers';
                bScatt.textContent = '🔵 Nodos PS/SBAS';
                bScatt.onclick = () => toggleSubsurface('scatterers', bScatt);
                subGrid.appendChild(bScatt);
            }

            // Update Info Card
            const info = data.info;
            let infoHtml = `
                <div style="font-weight: 700; color: #f8fafc; margin-bottom: 6px; display: flex; justify-content: space-between;">
                    <span>Diagnóstico Territorial 3D</span>
                    <span style="color: ${colorMap[terrId]}; font-size: 0.72rem;">${data.name}</span>
                </div>
                <div>• <strong>Cota Altitudinal:</strong> ${info.cota}</div>
            `;
            if (info.magma) infoHtml += `<div>• <strong>Cámara/Focos:</strong> ${info.magma}</div>`;
            if (info.dinamica) infoHtml += `<div>• <strong>Dinámica:</strong> ${info.dinamica}</div>`;
            if (info.ndvi) infoHtml += `<div>• <strong>Vigor Vegetal:</strong> ${info.ndvi}</div>`;
            if (info.dispersores) infoHtml += `<div>• <strong>Densidad Radar:</strong> ${info.dispersores}</div>`;
            infoHtml += `<div>• <strong>Metodología:</strong> <span style="color: var(--accent-cyan); font-weight:600;">${info.metodo}</span></div>`;
            document.getElementById('info-card-content').innerHTML = infoHtml;

            // Rebuild 3D Elements
            buildTerrain();
            buildSubsurface();
            buildMarkers();

            // Set Camera
            camera.position.set(data.camera.x, data.camera.y, data.camera.z);
            controls.target.set(0, data.camera.target_y, 0);
            controls.update();
        }

        function buildTerrain() {
            if (terrainMesh) scene.remove(terrainMesh);
            const data = territories3DData[currentTerritoryId];
            const dem = data.dem;
            const rows = dem.height;
            const cols = dem.width;
            const planeSize = 200;

            const geometry = new THREE.PlaneGeometry(planeSize, planeSize, cols - 1, rows - 1);
            geometry.rotateX(-Math.PI / 2);

            const pos = geometry.attributes.position;
            const baseElev = dem.elev_min;

            for (let i = 0; i < pos.count; i++) {
                const r = Math.floor(i / cols);
                const c = i % cols;
                const h = dem.elevations[r][c];
                const zNorm = ((h - baseElev) / 1000.0) * 22.0 * currentExaggeration;
                pos.setY(i, zNorm);
            }

            geometry.computeVertexNormals();

            const tex = getTexture(currentTextureId);
            const material = new THREE.MeshStandardMaterial({
                map: tex,
                roughness: 0.8,
                metalness: 0.1,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: parseFloat(document.getElementById('opacity-slider').value)
            });

            terrainMesh = new THREE.Mesh(geometry, material);
            terrainMesh.receiveShadow = true;
            terrainMesh.castShadow = true;
            scene.add(terrainMesh);
        }

        function latLonTo3D(lat, lon, elevMeters = 0) {
            const data = territories3DData[currentTerritoryId];
            const b = data.bounds;
            const planeSize = 200;
            
            const u = (lon - b.lon_min) / (b.lon_max - b.lon_min);
            const x = (u - 0.5) * planeSize;

            const v = (b.lat_max - lat) / (b.lat_max - b.lat_min);
            const z = (v - 0.5) * planeSize;

            const baseElev = data.dem.elev_min;
            const y = ((elevMeters - baseElev) / 1000.0) * 22.0 * currentExaggeration;

            return new THREE.Vector3(x, y, z);
        }

        function buildSubsurface() {
            if (magmaSphere) scene.remove(magmaSphere);
            if (conduitLine) scene.remove(conduitLine);
            while(seismicGroup.children.length > 0) seismicGroup.remove(seismicGroup.children[0]);
            while(scatterersGroup.children.length > 0) scatterersGroup.remove(scatterersGroup.children[0]);

            const data = territories3DData[currentTerritoryId];

            // 1. Magma Chamber (solo si aplica, e.g. Puracé)
            if (data.magma_chamber) {
                const mogi = data.magma_chamber;
                const refElev = data.dem.elev_max;
                const chamberPos = latLonTo3D(mogi.lat, mogi.lon, refElev - mogi.depth_m);

                const sphereGeom = new THREE.SphereGeometry(7.5, 32, 32);
                const sphereMat = new THREE.MeshStandardMaterial({
                    color: 0xef4444,
                    emissive: 0xff1100,
                    emissiveIntensity: 0.85,
                    roughness: 0.3,
                    transparent: true,
                    opacity: 0.95
                });

                magmaSphere = new THREE.Mesh(sphereGeom, sphereMat);
                magmaSphere.position.copy(chamberPos);
                magmaSphere.userData = {
                    title: `🌋 ${mogi.name}`,
                    info: `Profundidad: ${mogi.depth_km} km | ΔV: +${mogi.delta_v_mcm} M m³ | Lat: ${mogi.lat}°N, Lon: ${mogi.lon}°W`
                };
                scene.add(magmaSphere);

                // Volcanic Conduit
                const topPos = latLonTo3D(data.landmarks[0].lat, data.landmarks[0].lon, data.landmarks[0].elevation);
                const conduitCurve = new THREE.LineCurve3(chamberPos, topPos);
                const conduitGeom = new THREE.TubeGeometry(conduitCurve, 20, 1.2, 8, false);
                const conduitMat = new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.65 });
                conduitLine = new THREE.Mesh(conduitGeom, conduitMat);
                scene.add(conduitLine);
            }

            // 2. Hipocentros Sísmicos SGC
            if (data.seismic_events) {
                const refElev = data.dem.elev_max;
                data.seismic_events.forEach(ev => {
                    const evPos = latLonTo3D(ev.lat, ev.lon, refElev - (ev.depth_km * 1000.0));
                    const r = Math.max(1.8, ev.mag * 1.3);
                    const sGeom = new THREE.SphereGeometry(r, 16, 16);
                    const depthColor = ev.depth_km < 3.0 ? 0xff3b30 : (ev.depth_km <= 5.0 ? 0xff9500 : 0x007aff);
                    const sMat = new THREE.MeshStandardMaterial({
                        color: depthColor,
                        emissive: depthColor,
                        emissiveIntensity: 0.6,
                        roughness: 0.4
                    });

                    const sMesh = new THREE.Mesh(sGeom, sMat);
                    sMesh.position.copy(evPos);
                    sMesh.userData = {
                        title: `⚡ Sismo SGC: ${ev.mag.toFixed(1)} ML`,
                        info: `Profundidad: ${ev.depth_km} km | Foco: ${ev.lugar} | Fecha: ${ev.fecha}`
                    };
                    seismicGroup.add(sMesh);
                });
            }

            // 3. Dispersores PS y SBAS (Samanga Baja)
            if (data.scatterers) {
                data.scatterers.forEach(sc => {
                    const isPs = sc.method === 'PS';
                    const scPos = latLonTo3D(sc.lat, sc.lon, 1850.0);
                    const scGeom = new THREE.SphereGeometry(isPs ? 1.5 : 1.2, 12, 12);
                    const scColor = isPs ? 0x00d2ff : 0xffcc00;
                    const scMat = new THREE.MeshStandardMaterial({
                        color: scColor,
                        emissive: scColor,
                        emissiveIntensity: 0.65
                    });
                    const scMesh = new THREE.Mesh(scGeom, scMat);
                    scMesh.position.copy(scPos);
                    scMesh.userData = {
                        title: `Dispersor ${sc.method} (ASI: ${sc.asi.toFixed(3)})`,
                        info: `V_LOS: ${sc.v_los >= 0 ? '+' : ''}${sc.v_los.toFixed(2)} mm | Vertical: ${sc.v_aa >= 0 ? '+' : ''}${sc.v_aa.toFixed(2)} mm`
                    };
                    scatterersGroup.add(scMesh);
                });
            }
        }

        function buildMarkers() {
            while(markersGroup.children.length > 0) markersGroup.remove(markersGroup.children[0]);
            const data = territories3DData[currentTerritoryId];

            if (data.landmarks) {
                data.landmarks.forEach(lm => {
                    const pos = latLonTo3D(lm.lat, lm.lon, lm.elevation + 60);
                    const coneGeom = new THREE.ConeGeometry(2.5, 6, 16);
                    coneGeom.rotateX(Math.PI);
                    const colorHex = parseInt(lm.color.replace('#', '0x'), 16);
                    const coneMat = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 0.5 });
                    const pin = new THREE.Mesh(coneGeom, coneMat);
                    pin.position.copy(pos);
                    pin.userData = { title: lm.name, info: `Elevación: ${lm.elevation} m s.n.m.` };
                    markersGroup.add(pin);
                });
            }
        }

        function switchTexture(file, btn) {
            if (!terrainMesh) return;
            currentTextureId = file;
            terrainMesh.material.map = getTexture(file);
            terrainMesh.material.needsUpdate = true;

            document.querySelectorAll('#texture-btn-grid .control-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function setMeshOpacity(val) {
            if (!terrainMesh) return;
            terrainMesh.material.opacity = parseFloat(val);
            document.getElementById('opacity-val').textContent = Math.round(val * 100) + '%';
        }

        function setExaggeration(val) {
            currentExaggeration = parseFloat(val);
            document.getElementById('exag-val').textContent = currentExaggeration.toFixed(1) + '×';
            buildTerrain();
            buildSubsurface();
            buildMarkers();
        }

        function toggleSubsurface(type, btn) {
            if (type === 'magma' && magmaSphere) {
                const vis = !magmaSphere.visible;
                magmaSphere.visible = vis;
                if (conduitLine) conduitLine.visible = vis;
                btn.textContent = vis ? "🌋 Ocultar Magma" : "🌋 Mostrar Magma";
                btn.classList.toggle('active', !vis);
            } else if (type === 'seismic') {
                const vis = !seismicGroup.visible;
                seismicGroup.visible = vis;
                btn.textContent = vis ? "⚡ Ocultar Sismos" : "⚡ Mostrar Sismos";
                btn.classList.toggle('active', !vis);
            } else if (type === 'scatterers') {
                const vis = !scatterersGroup.visible;
                scatterersGroup.visible = vis;
                btn.textContent = vis ? "🔵 Ocultar Nodos" : "🔵 Nodos PS/SBAS";
                btn.classList.toggle('active', !vis);
            }
        }

        function toggleRotation(btn) {
            isRotating = !isRotating;
            btn.classList.toggle('active', isRotating);
        }

        function resetCamera() {
            const data = territories3DData[currentTerritoryId];
            camera.position.set(data.camera.x, data.camera.y, data.camera.z);
            controls.target.set(0, data.camera.target_y, 0);
            controls.update();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const targets = [];
            if (magmaSphere && magmaSphere.visible) targets.push(magmaSphere);
            if (seismicGroup && seismicGroup.visible) targets.push(...seismicGroup.children);
            if (scatterersGroup && scatterersGroup.visible) targets.push(...scatterersGroup.children);
            if (markersGroup) targets.push(...markersGroup.children);

            const intersects = raycaster.intersectObjects(targets);
            if (intersects.length > 0) {
                const hit = intersects[0].object;
                if (hit.userData && hit.userData.title) {
                    tooltip.style.display = 'block';
                    tooltip.style.left = (event.clientX + 14) + 'px';
                    tooltip.style.top = (event.clientY + 14) + 'px';
                    tooltip.innerHTML = `<strong>${hit.userData.title}</strong><br><span style="color: #cbd5e1;">${hit.userData.info || ''}</span>`;
                }
            } else {
                tooltip.style.display = 'none';
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isRotating) {
                scene.rotation.y += 0.003;
            }

            if (magmaSphere && magmaSphere.visible) {
                const t = Date.now() * 0.003;
                const scale = 1.0 + Math.sin(t) * 0.06;
                magmaSphere.scale.set(scale, scale, scale);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
