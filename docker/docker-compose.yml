# =============================================================================
# Copernico - docker-compose.yml
# Orquestación de servicios: desarrollo y dashboard
# =============================================================================

services:
  # =============================================================================
  # SERVICIO 1: Entorno de ejecución y scripts Python
  # =============================================================================
  copernico-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: copernico:latest
    container_name: copernico-dev
    volumes:
      # Código del proyecto (bind mount para edición live)
      - ../:/opt/copernico
      # Datos satelitales persistentes
      - copernico_data:/data
      # Outputs generados
      - copernico_outputs:/outputs
      # Credenciales
      - ../.env:/opt/copernico/.env:ro
    environment:
      - PYTHONPATH=/opt/copernico
      - COPERNICO_DATA=/data
      - COPERNICO_OUTPUTS=/outputs
    working_dir: /opt/copernico
    stdin_open: true
    tty: true
    command: /bin/bash

  # =============================================================================
  # SERVICIO 2: Dashboard web (Leaflet / visualización en vivo)
  # =============================================================================
  copernico-dashboard:
    image: nginx:alpine
    container_name: copernico-dashboard
    volumes:
      - ../dashboard:/usr/share/nginx/html
      - ../outputs/dashboard:/usr/share/nginx/html/data:ro
    ports:
      - "8085:80"
    restart: unless-stopped

# =============================================================================
# VOLÚMENES NOMBRADOS (datos persistentes)
# =============================================================================
volumes:
  copernico_data:
  copernico_outputs:
